name: Validate Codex plugin

# Validation, drift check, and packaging for pull requests and the default
# branch. This workflow can never publish: its token is read-only and checkout
# credentials are not persisted. Portal publication and live reviewed-directory
# tests are owner actions, outside ordinary PR CI.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate plugin, skills, references, and eval fixtures
        run: python3 scripts/validate_repo.py

      - name: Quality-gates script self-tests
        run: |
          python3 -m pip install --quiet Pillow
          python3 plugins/email-love/skills/email-love-figma-quality-gates/scripts/validate_batch_snapshot.py --self-test
          python3 plugins/email-love/skills/email-love-figma-quality-gates/scripts/check_icon_perimeter.py --self-test

      - name: Check shared-rule drift against canonical claude-skills
        run: |
          COMMIT="$(python3 -c 'import json; print(json.load(open("sources.json"))["upstream"]["commit"])')"
          git clone --quiet https://github.com/email-love/claude-skills /tmp/claude-skills
          # The pin must exist: push claude-skills first, then this repo. A
          # fallback to main would validate against unpinned content and mark
          # a release as synchronized when it is not (2026-09-05 review, R7).
          git -C /tmp/claude-skills checkout --quiet "$COMMIT"
          python3 scripts/check_shared_drift.py --claude-skills /tmp/claude-skills

      - name: Check out the pinned ESP skills source
        run: |
          ESP_PIN="$(python3 -c 'import json; print(json.load(open("sources.json"))["espSkills"]["commit"])')"
          git clone --quiet https://github.com/email-love/esp-skills /tmp/esp-skills
          git -C /tmp/esp-skills checkout --quiet "$ESP_PIN"

      - name: Build plugin distributions
        run: ESP_SKILLS_DIR=/tmp/esp-skills bash scripts/build_plugin.sh

      - name: Verify distributions (integrity, split, parity, ESP byte-equality, checksums, determinism)
        run: ESP_SKILLS_DIR=/tmp/esp-skills bash scripts/verify_plugin_dist.sh

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
